name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: PNPM
        uses: pnpm/setup@v2
        with:
          cache: true
          runtime: node@${{ matrix.node }}
      - name: Execute tests
        run: pnpm test
        env:
          CI: true
          NODE_OPTIONS: '--trace-deprecation'
      - name: Build
        run: pnpm --filter "@fractality/mandelbrot" build
