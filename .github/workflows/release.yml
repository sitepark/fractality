name: Release
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Bump the version and build, but publish nothing and push nothing'
        type: boolean
        default: false
      bump:
        description: 'Version bump. "conventional" reads it from the commit messages; anything else overrides it.'
        type: choice
        default: conventional
        options:
          - conventional
          - patch
          - minor
          - major

# Never let two releases interleave: they would race on tags and versions.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # Lets lerna mint a short-lived, per-package npm credential from GitHub's
  # OIDC provider. This is the only way the release authenticates to the
  # registry; there is no stored token. See docs/RELEASING.md.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Conventional-commit changelogs need the full history and all tags
          # to work out what changed since each package's last release.
          fetch-depth: 0

      - name: PNPM
        uses: pnpm/setup@v3
        with:
          cache: true
          runtime: node@24

      # Publishing authenticates through trusted publishing, so there is no
      # stored credential to check. What can go missing is the OIDC token
      # itself, if the id-token permission above is ever dropped: lerna treats
      # a failed exchange as optional and carries on unauthenticated, so the
      # release would only die at publish time, once versions and tags exist.
      # Fail here instead, before anything is written.
      - name: Verify OIDC availability
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL}" ]; then
            echo "::error::GitHub issued no OIDC token; check that this workflow still grants id-token: write."
            exit 1
          fi
          echo "OIDC token endpoint available"

      - name: Validate
        run: pnpm run validate

      - name: Test
        run: pnpm test
        env:
          CI: true

      - name: Configure git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      # All packages share one version (docs/adr/0006). lerna only writes it into
      # the package.json files; the changelog, the commit and the tag are made
      # here, so the changelog lands in the same commit as the version.
      #
      # --no-push is the crux: the version commit and the tag stay local until
      # the packages are actually on npm. A failed publish leaves the remote
      # untouched, so re-running the workflow is a clean retry.
      #
      # An explicit bump overrides what the commit messages imply. Use it to hold
      # back a major that a `feat!` in the backlog would otherwise force; the
      # changelog still records the breaking change either way.
      - name: Bump version and write changelog
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          LAST=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "${LAST}" ]; then
            # The first shared version. Everything before it is recorded in the
            # per-package changelogs, which end at the last per-package release.
            # Once a v* tag exists this branch is dead and can go.
            if [ "${BUMP}" != major ]; then
              echo "::error::The first release with a shared version must be run with bump: major (2.5.0 => 3.0.0). See docs/RELEASING.md."
              exit 1
            fi
            # git-cliff then also writes CHANGELOG.md from scratch, header and all.
            COMMITS=('@fractality/fractality@1.9.0..HEAD')
            WRITE=(--output CHANGELOG.md)
          else
            COMMITS=(--unreleased)
            WRITE=(--prepend CHANGELOG.md)
          fi

          # --force-publish below releases every package whether or not anything
          # changed, so refuse here when the changelog would be empty, e.g. when
          # only CI config or dev dependencies moved.
          if [ "$(pnpm exec git-cliff "${COMMITS[@]}" --context | jq '[.[].commits[]] | length')" -eq 0 ]; then
            echo "::error::Nothing to release: no changelog-worthy commits since ${LAST:-the last per-package release}."
            exit 1
          fi

          # git-cliff picks the bump from the same commits it renders into the
          # changelog, so the version and the notes cannot disagree.
          if [ "${BUMP}" = conventional ]; then
            BUMP=$(pnpm exec git-cliff --bumped-version)
            BUMP=${BUMP#v}
          fi
          pnpm lerna version "${BUMP}" --force-publish --no-private --no-git-tag-version --no-push --yes

          TAG="v$(node -p "require('./lerna.json').version")"
          node scripts/check-peer-ranges.mjs

          pnpm exec git-cliff "${COMMITS[@]}" --tag "${TAG}" "${WRITE[@]}"
          pnpm exec git-cliff "${COMMITS[@]}" --tag "${TAG}" --strip all --output /tmp/release-notes.md

          git add --all
          git commit --message "chore(release): ${TAG}"
          git tag --annotate "${TAG}" --message "${TAG}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Show pending release
        run: cat /tmp/release-notes.md >> "${GITHUB_STEP_SUMMARY}"

      # from-package (not from-git) compares each package.json version against
      # the registry and publishes only what is missing, so it is idempotent and
      # self-healing: a partially published release is completed by re-running.
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: pnpm lerna publish from-package --yes

      # Only now is it safe to move the remote: npm and git cannot diverge.
      - name: Push version commit and tags
        if: ${{ !inputs.dry-run }}
        run: git push --follow-tags origin HEAD:main

      # Safe to re-run: an existing release is left alone.
      - name: Create GitHub release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "${TAG}: release already exists, leaving it as is."
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/release-notes.md --verify-tag --latest
          fi

      - name: Report dry run
        if: ${{ inputs.dry-run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo
            echo "---"
            echo
            echo "**Dry run:** nothing published or pushed. The notes above are what ${TAG} would ship with."
          } >> "${GITHUB_STEP_SUMMARY}"
