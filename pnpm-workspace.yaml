packages:
  - "packages/*"
  - "examples/*"
allowBuilds:
  '@parcel/watcher': true
  nx: true
minimumReleaseAgeExclude:
  - rollup-plugin-visualizer@7.1.1

overrides:
  # handlebars and mandelbrot peer-depend on fractality with a plain semver
  # range, which autoInstallPeers would otherwise satisfy by downloading the
  # last published release and its whole dependency tree. Point it at the
  # workspace copy instead. A devDependency would do the same, but lerna reads
  # that as a dependency cycle.
  '@fractality/fractality': 'workspace:*'

  # Advisories in transitive dependencies of the lerna/nx toolchain, which pins
  # them too tightly to pick up the fixes on its own. All dev-only: none of
  # these reach a published package. Drop an entry once the upstream range
  # widens.
  'brace-expansion@>=4.0.0 <5.0.9': '^5.0.9' # GHSA-rgw5-rvv9-x895
  'js-yaml@>=4.0.0 <4.3.1': '^4.3.1' # GHSA-5p4m-2wfm-xmqj
  'tar@>=7.0.0 <7.5.21': '^7.5.22' # GHSA-r292-9mhp-454m
